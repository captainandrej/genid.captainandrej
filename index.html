            <h2>Správa kariet</h2>
            <p>Pridávajte nové karty pre rôznych ľudí. Názov v zozname sa aktualizuje po odchode z políčka s menom.</p>
            
            <!-- Moderné tlačidlá -->
            <div class="action-buttons-group">
                <button class="btn-modern btn-add-card" id="addCardBtn">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Add card
                </button>
                <button class="btn-modern btn-print-card" onclick="window.print()">
                    <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                    Print card
                </button>
            </div>

            <hr style="border: 0; border-top: 1px solid #ccc; margin: 5px 0;">
            <p style="font-size: 12px; font-weight: bold;">Zoznam vytvorených kariet:</p>
            
            <div class="cards-list" id="cardsListContainer"></div>

            <!-- Prepínač Light / Dark -->
            <div class="theme-switch-wrapper">
                <div class="theme-switch-container">
                    <button class="theme-btn active" id="lightThemeBtn" onclick="setTheme('light')">
                        <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>
                        Light
                    </button>
                    <button class="theme-btn" id="darkThemeBtn" onclick="setTheme('dark')">
                        <svg viewBox="0 0 24 24"><path d="M12.3 2c-5.52 0-10 4.48-10 10 0 3.75 2.11 7.02 5.25 8.65.42.22.9-.07.9-.54v-1.63c0-.39-.17-.76-.46-1.02-2.31-2.07-2.31-5.63 0-7.7 2.16-1.95 5.56-1.95 7.72 0 1.83 1.65 2.16 4.39.81 6.42-.23.34.02.8.43.8h1.8c.45 0 .82-.36.78-.81-.36-4.51-3.68-8.2-8.29-8.79-2.04-.26-4.04.47-5.54 1.89-1.4 1.33-2.18 3.16-2.18 5.09s.78 3.76 2.18 5.09c1.5 1.42 3.5 2.15 5.54 1.89 2.15-.27 4.02-1.45 5.12-3.15.54-.83 1.63-.99 2.37-.36.76.65.88 1.77.29 2.56-1.57 2.12-4.11 3.42-6.84 3.42-5.52 0-10-4.48-10-10s4.48-10 10-10c.55 0 1 .45 1 1s-.45 1-1 1z"/></svg>
                        Dark
                    </button>
                </div>
            </div>
        </div>

        <div class="preview-area" id="cardsContainer"></div>
    </div>

    <script>
        function getRandomCardData() {
            const mena = ["Marek Horváth", "Lucia Vargová", "Tomáš Kováč", "Katarína Novotná", "Peter Ďuriš", "Michal Lukáč", "Veronika Blašková", "Andrej Gábor"];
            const firmy = ["Stavotech, s.r.o.", "BuildMaster, a.s.", "Apex Construct", "GeoMont, s.r.o.", "HighWork SK", "Vertical Pro s.r.o."];
            const skolitelia = ["Ing. Zuzana Hubinská", "Ing. Milan Krtko, PhD.", "Mgr. Robert Švec", "Ing. Pavol Hruška"];
            const druhy = ["Opakované", "Vstupné", "Mimoriadne"];

            const randomMeno = mena[Math.floor(Math.random() * mena.length)];
            const randomFirma = firmy[Math.floor(Math.random() * firmy.length)];
            const randomSkolitel = skolitelia[Math.floor(Math.random() * skolitelia.length)];
            const randomDruh = druhy[Math.floor(Math.random() * druhy.length)];
            const randomDocNum = Math.floor(100 + Math.random() * 899) + "/2026";
            
            const randomDay = Math.floor(1 + Math.random() * 28);
            const randomMonth = Math.floor(1 + Math.random() * 12);
            const randomYear = Math.floor(1980 + Math.random() * 20);

            return {
                id: 1,
                druh: randomDruh,
                rozsah: "Práce vo výškach a nad voľnou hĺbkou s využitím kolektívneho zabezpečenia (lešenia, plošiny, zábradlia); Práce vo výškach s osobným zabezpečením (postroje, laná)",
                datumSkolenia: "15.5.2026",
                platnost: "14.5.2027",
                skolitel: randomSkolitel,
                cisloDokladu: randomDocNum,
                meno: randomMeno,
                datumNarodenia: `${randomDay}.${randomMonth}.${randomYear}`,
                zamestnavatel: randomFirma
            };
        }

        let cardsData = [getRandomCardData()];
        let activeCardId = 1;

        function setTheme(mode) {
            const lightBtn = document.getElementById('lightThemeBtn');
            const darkBtn = document.getElementById('darkThemeBtn');
            
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                darkBtn.classList.add('active');
                lightBtn.classList.remove('active');
            } else {
                document.body.classList.remove('dark-mode');
                lightBtn.classList.add('active');
                darkBtn.classList.remove('active');
            }
        }

        function renderApp() {
            const container = document.getElementById('cardsContainer');
            const listContainer = document.getElementById('cardsListContainer');
            
            container.innerHTML = '';
            listContainer.innerHTML = '';

            cardsData.forEach((card, index) => {
                // Ak uplynuli každé 3 karty (index > 0 a jedeliteľný 3), vložíme oddeľovaciu čiaru reprezentujúcu novú A4 stranu
                if (index > 0 && index % 3 === 0) {
                    const pageDivider = document.createElement('div');
                    pageDivider.style.cssText = "margin: 8px 0; border-top: 2px dashed #cbd5e0; position: relative;";
                    pageDivider.innerHTML = `<span style="position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: #f7fafc; padding: 0 6px; font-size: 10px; color: #718096; font-weight: bold; border-radius: 4px;">Nová A4 strana</span>`;
                    listContainer.appendChild(pageDivider);
                }

                const thumb = document.createElement('div');
                thumb.className = `card-item-thumb ${card.id === activeCardId ? 'active' : ''}`;
                thumb.innerHTML = `
                    <span>Karta #${index + 1}: <strong>${card.meno || 'Neznámy'}</strong></span>
                    ${cardsData.length > 1 ? `<button class="btn-delete-card" onclick="deleteCard(event, ${card.id})">&times;</button>` : ''}
                `;
                thumb.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        activeCardId = card.id;
                        renderApp();
                        document.getElementById(`card-${card.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                };
                listContainer.appendChild(thumb);

                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'card-wrapper';
                cardWrapper.id = `card-${card.id}`;
                
                cardWrapper.innerHTML = `
                    <div class="card-side">
                        <div class="left-side-container">
                            <div>
                                <h3>PODROBNOSTI O ŠKOLENÍ</h3>
                                <div class="top-section">
                                    <div class="field-group inline">
                                        <span class="label">Druh oboznamovania:</span>
                                        <span contenteditable="true" class="editable" data-id="${card.id}" data-key="druh">${card.druh}</span>
                                    </div>
                                    <div class="field-group block">
                                        <span class="label">Rozsah školenia:</span>
                                        <span contenteditable="true" class="editable" data-id="${card.id}" data-key="rozsah">${card.rozsah}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="bottom-section">
                                <div class="field-group inline">
                                    <span class="label">Dátum školenia:</span>
                                    <span contenteditable="true" class="editable" data-id="${card.id}" data-key="datumSkolenia">${card.datumSkolenia}</span>
                                </div>
                                <div class="field-group inline">
                                    <span class="label">Platnosť dokladu do:</span>
                                    <span contenteditable="true" class="editable" data-id="${card.id}" data-key="platnost">${card.platnost}</span>
                                </div>
                                <div class="field-group inline">
                                    <span class="label">Školiteľ / BT:</span>
                                    <span contenteditable="true" class="editable" data-id="${card.id}" data-key="skolitel">${card.skolitel}</span>
                                </div>
                            </div>

                            <div class="signature-line">
                                <span>Podpis a pečiatka BT</span>
                            </div>
                        </div>
                    </div>

                    <div class="card-side">
                        <div class="header-group">
                            <h3>DOKLAD O ABSOLVOVANÍ OBOZNÁMOVANIA</h3>
                            <span class="subtitle">pre práce vo výškach a nad voľnou hĺbkou</span>
                            <span class="law">(v zmysle § 7 zákona č. 124/2006 Z. z. a vyhlášky MPSVR SR č. 147/2013 Z. z.)</span>
                        </div>

                        <div class="content-group">
                            <div class="field-group inline">
                                <span class="label">Číslo dokladu:</span>
                                <span contenteditable="true" class="editable" data-id="${card.id}" data-key="cisloDokladu">${card.cisloDokladu}</span>
                            </div>
                            <div class="field-group inline">
                                <span class="label">Titul, Meno, Priezvisko:</span>
                                <span contenteditable="true" class="editable highlight" data-id="${card.id}" data-key="meno">${card.meno}</span>
                            </div>
                            <div class="field-group inline">
                                <span class="label">Dátum narodenia:</span>
                                <span contenteditable="true" class="editable" data-id="${card.id}" data-key="datumNarodenia">${card.datumNarodenia}</span>
                            </div>
                            <div class="field-group inline">
                                <span class="label">Zamestnávateľ:</span>
                                <span contenteditable="true" class="editable" data-id="${card.id}" data-key="zamestnavatel">${card.zamestnavatel}</span>
                            </div>
                        </div>

                        <div></div> 
                    </div>
                `;
                container.appendChild(cardWrapper);
            });

            document.querySelectorAll('.editable').forEach(el => {
                el.addEventListener('input', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    const key = e.target.getAttribute('data-key');
                    const card = cardsData.find(c => c.id === id);
                    if (card) {
                        card[key] = e.target.innerText;
                    }
                });

                if (el.getAttribute('data-key') === 'meno') {
                    el.addEventListener('blur', () => {
                        renderApp();
                    });
                }
            });
        }

        document.getElementById('addCardBtn').addEventListener('click', () => {
            const lastCard = cardsData[cardsData.length - 1];
            const newId = cardsData.length > 0 ? Math.max(...cardsData.map(c => c.id)) + 1 : 1;
            
            let nextDocNum = "102/2026";
            if (lastCard && lastCard.cisloDokladu) {
                const parts = lastCard.cisloDokladu.split('/');
                if (!isNaN(parts[0])) {
                    nextDocNum = (parseInt(parts[0]) + 1) + (parts[1] ? '/' + parts[1] : '');
                }
            }

            const newCard = {
                id: newId,
                druh: lastCard ? lastCard.druh : "Opakované",
                rozsah: lastCard ? lastCard.rozsah : "",
                datumSkolenia: lastCard ? lastCard.datumSkolenia : "",
                platnost: lastCard ? lastCard.platnost : "",
                skolitel: lastCard ? lastCard.skolitel : "",
                cisloDokladu: nextDocNum,
                meno: "Nové Meno",
                datumNarodenia: "",
                zamestnavatel: lastCard ? lastCard.zamestnavatel : ""
            };

            cardsData.push(newCard);
            activeCardId = newId;
            renderApp();
        });

        window.deleteCard = function(e, id) {
            e.stopPropagation();
            if (cardsData.length <= 1) return;
            cardsData = cardsData.filter(c => c.id !== id);
            activeCardId = cardsData[cardsData.length - 1].id;
            renderApp();
        }

        renderApp();
    </script>
</body>
</html>
